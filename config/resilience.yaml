breaker:
  enabled: true
  force_state: null
  window_seconds: 60
  min_requests: 3
  failure_ratio: 0.6
  initial_open_seconds: 10
  max_open_seconds: 60
  half_open_successes: 2
timeouts_ms:
  router_model: 30000  # hy3 valid structured output took 21.5s; one bounded attempt.
  main_model: 60000
failure_classes:
  count_in_breaker: [timeout, connect_error, http_5xx]
  count_separately: [http_429, invalid_json, validation_error, client_cancel, internal_error]
alerts:
  window_seconds: 300
  min_requests: 10
  degraded_ratio_threshold: 0.2
  open_duration_seconds_threshold: 300
