function toggleImages(button){const enabled=button.getAttribute("aria-pressed")!=="true";button.setAttribute("aria-pressed",String(enabled));button.textContent=enabled?"图片：开":"图片：关";document.body.classList.toggle("images-off",!enabled);}

let sidebarReturnFocus=null;
function sidebarFocusable(){return [...$('sidebar').querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),[tabindex]:not([tabindex="-1"])')].filter(node=>!node.hidden);}
function syncSidebarMode(){
 const sidebar=$('sidebar'),toggle=$('toggleSidebar'),collapsed=document.querySelector('.shell').classList.contains('collapsed');
 if(mobileSidebar.matches){
  const open=sidebar.classList.contains('open');sidebar.inert=!open;$('backdrop').hidden=!open;
  toggle.setAttribute('aria-expanded',String(open));toggle.setAttribute('aria-label',open?'关闭历史对话':'打开历史对话');
 }else{
  sidebar.inert=false;$('backdrop').hidden=true;toggle.setAttribute('aria-expanded',String(!collapsed));
  toggle.setAttribute('aria-label',collapsed?'打开历史对话':'关闭历史对话');
 }
}
function openSidebar(){
 sidebarReturnFocus=document.activeElement;$('sidebar').classList.add('open');syncSidebarMode();
 requestAnimationFrame(()=>$('newChat').focus());
}
function closeSidebar(restoreFocus=true){
 const wasOpen=$('sidebar').classList.contains('open');$('sidebar').classList.remove('open');syncSidebarMode();
 if(wasOpen&&restoreFocus&&mobileSidebar.matches)(sidebarReturnFocus||$('toggleSidebar')).focus({preventScroll:true});
}
$('toggleSidebar').setAttribute('aria-controls','sidebar');
$('toggleSidebar').onclick=()=>{if(mobileSidebar.matches){if($('sidebar').classList.contains('open'))closeSidebar();else openSidebar();}else{document.querySelector('.shell').classList.toggle('collapsed');syncSidebarMode();}};
$('backdrop').onclick=()=>closeSidebar();
$('sidebar').addEventListener('keydown',event=>{
 if(!mobileSidebar.matches||!$('sidebar').classList.contains('open'))return;
 if(event.key==='Escape'){event.preventDefault();closeSidebar();return;}
 if(event.key!=='Tab')return;
 const focusable=sidebarFocusable();if(!focusable.length){event.preventDefault();return;}
 const first=focusable[0],last=focusable.at(-1);
 if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
 else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&mobileSidebar.matches&&$('sidebar').classList.contains('open')){event.preventDefault();closeSidebar();}});

syncSidebarMode();
const examples=[
['用食材找菜谱','冰箱里有什么，就从什么开始。','我有【食材清单】，家里还有【调料】，可以做哪些菜？请说明还缺什么。'],
['一步步学做菜','用料、顺序、时间，逐步说明。','我想做【菜名】，我是新手。请根据菜谱原文说明用料和操作步骤。'],
['安排一顿饭','按人数、时间和菜汤数量搭配。','帮我安排【人数】人的【午餐/晚餐】，有【时间】分钟，想做【几】菜【几】汤。'],
['核对烹饪细节','温度、用量和替代，查证再答。','【菜名】里的【食材】需要多少？【替代食材】能替换吗？原文没说明的请明确指出。'],
['查看原文与图片','直接找到菜谱和步骤配图。','请给我【菜名】的完整原文和【章节/步骤】图片。'],
['结合个人偏好','直接说明偏好，后续问答参考。','请记住：我【饮食偏好】，家里有【设备】。今天想用【食材】做一道简单的菜。']];

async function api(url,options){let r;try{r=await fetch(url,options);}catch(error){if(error.name==='AbortError')throw error;throw new Error('无法连接本地服务，请确认项目已启动后重试。');}let data;try{data=await r.json();}catch{throw new Error('服务响应无效');}if(!r.ok){if(r.status===401)$('accessPanel').hidden=false;throw new Error(data.error||'服务暂不可用');}return data;}

async function loadHistory(){try{const rows=await api('/api/conversations');const list=$('historyList');list.replaceChildren();if(!rows.length)list.append(element('p','暂无历史对话','muted'));for(const row of rows){const b=element('button',row.title,row.id===currentConversation?'selected':'');b.title=row.title;b.onclick=()=>openConversation(row.id);list.append(b);}}catch(error){$('historyList').textContent=error.message;}}
function readingNodes(){return [...$('results').querySelectorAll('.user-message,.recipe-title,.recipe-text h3,.recipe-text p,.recipe-text li,figure')];}
function rememberConversationPosition(){if(!currentConversation)return;const area=$('scrollArea'),bounds=area.getBoundingClientRect(),nodes=readingNodes(),index=nodes.findIndex(node=>{const rect=node.getBoundingClientRect();return rect.bottom>bounds.top+8&&rect.top<bounds.bottom;});conversationPositions.set(currentConversation,{scrollTop:area.scrollTop,index,offset:index<0?0:nodes[index].getBoundingClientRect().top-bounds.top});}
function restoreConversationPosition(saved){const area=$('scrollArea'),node=readingNodes()[saved.index];area.scrollTop=node?Math.max(0,area.scrollTop+node.getBoundingClientRect().top-area.getBoundingClientRect().top-saved.offset):saved.scrollTop;}

function focusTurn(target){const area=$('scrollArea');if(!target){area.scrollTop=0;return;}area.scrollTop=Math.max(0,area.scrollTop+target.turn.getBoundingClientRect().top-area.getBoundingClientRect().top-16);}
function turnStartVisible(target){const area=$('scrollArea').getBoundingClientRect(),top=target.turn.getBoundingClientRect().top;return top>=area.top-32&&top<area.bottom-40;}
async function renderHistoryMessages(messages,token){
 let turn,sliceStart=performance.now();
 for(const message of messages){
  if(token!==historyRequest)return null;
  if(message.role==='user'){turn=createTurn(message.content,false);turn.trace.hidden=true;}
  else if(message.record){turn=turn||createTurn('历史回答',false);render(message.record,turn);if(Number.isFinite(message.record.trace?.created)){turn.trace.hidden=false;drawTimeline(turn,message.record.trace);turn.trace.open=false;}

  if(!structured&&!data.display_source?.length)for(const image of images)if(!used.has(image.image_path+':'+image.source_line))card.append(recipeFigure(image,row.title));
  if(!answer&&!originalAnswer&&!images.length)return;
  makeRecipeCardInteractive(card,row,data);grid.append(card);
 });root.append(grid);if(data.recommendations?.length&&data.recommendation_kind!=='preference')root.append(element('p',data.validation,'muted'));
}

$('cancel').onclick=async()=>{if(!currentJob)return;try{await api('/api/cancel',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:currentJob})});$('progress').textContent='正在停止…';}catch(e){$('progress').textContent=e.message;}};
question.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!busy)form.requestSubmit();}};
form.onsubmit=async event=>{event.preventDefault();if(busy)return;if(historyLoading){$('progress').textContent='历史对话正在加载，请稍候再发送。';return;}const text=question.value.trim();if(!text||Array.from(text).length>2000){$('progress').textContent=text?'问题最多2000字。':'请输入问题。';question.focus();return;}if(/【[^】]*】/.test(text)){$('progress').textContent='请先把模板中的【内容】替换成你的信息。';question.focus();return;}busy=true;$('submit').disabled=true;const target=activeTurn=createTurn(text);const submittedAt=Date.now()/1000;let timer;
try{if(!currentConversation){const c=await api('/api/conversations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'新对话'})});currentConversation=c.id;}const job=await api('/api/ask',{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':crypto.randomUUID()},body:JSON.stringify({question:text,mode:'auto',conversation_id:currentConversation})});currentJob=job.job_id;question.value='';$('cancel').hidden=false;loadHistory();let lastState=null,received=0;timer=setInterval(()=>{if(lastState&&!lastState.finished)timelineClock(target,{...lastState,server_time:lastState.server_time+(performance.now()-received)/1000});},1000);
while(true){const state=await api('/api/job?id='+job.job_id);lastState=state;received=performance.now();drawTimeline(target,state);$('progress').textContent=inventoryQuestion(text)?'正在查询…':state.progress;if(['failed','cancelled','expired'].includes(state.state))throw new Error(state.progress);if(state.state==='done'){const follow=turnStartVisible(target);render(state.result,target);target.trace.open=false;if(follow)focusTurn(target);loadHistory();$('progress').textContent='Enter 发送 · Shift + Enter 换行';break;}await new Promise(resolve=>setTimeout(resolve,650));}
}catch(e){target.body.append(element('p',e.message,'error'));if(!['failed','cancelled','expired'].includes(target.timelineState?.state)){const now=Date.now()/1000;drawTimeline(target,{...target.timelineState,created:target.timelineState?.created??submittedAt,finished:now,state:'failed',progress:e.message});}$('progress').textContent=/取消|已停止|取消中/.test(e.message)?'Enter 发送 · Shift + Enter 换行':e.message;question.value=text;}finally{clearInterval(timer);busy=false;$('submit').disabled=false;$('cancel').hidden=true;currentJob=null;}
};
$('accessForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:$('accessToken').value})});$('accessToken').value='';$('accessPanel').hidden=true;loadHistory();}catch(e){$('accessMessage').textContent=e.message;}};
if(location.protocol==='file:')location.replace('http://127.0.0.1:8080/');else{loadHistory();loadModel();}
